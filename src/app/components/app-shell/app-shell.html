<div class="shell">
  <aside class="sidebar" aria-label="Navegacion principal">
    <div class="brand">
      <span class="brand-mark">SR</span>
      <div>
        <strong>SSRMining</strong>
        <small>Control perforaciones</small>
      </div>
    </div>

    <nav class="nav-list">
      @for (item of navigation; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          <i class="bi" [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <small>Desarrollado por</small>
      <strong>Credere.Dev</strong>
    </div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <div>
        <small>Operacion mina</small>
        <strong>Backend V1 conectado</strong>
      </div>

      <div class="user-chip">
        <span>{{ iniciales() }}</span>
        <div>
          <strong>{{ usuario()?.nombre || 'Usuario' }} {{ usuario()?.apellido || '' }}</strong>
          <small>{{ usuario()?.email || 'Sesion activa' }}</small>
        </div>
        <button type="button" class="icon-button" (click)="cerrarSesion()" title="Cerrar sesion">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>
