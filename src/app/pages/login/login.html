<main class="login-page">
  <section class="login-panel">
    <div class="brand-row">
      <img src="/ssrminingLOGO.png" alt="SSRMining" />
      <div>
        <strong>SSRMining</strong>
        <small>Control de perforaciones</small>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <h1>Ingreso operativo</h1>
      <p>Acceso para administradores, supervisores y operadores autorizados.</p>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <label>
        Contrasena
        <span class="password-field">
          <input [type]="mostrarPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button type="button" class="eye-button" (click)="togglePassword()" [attr.aria-label]="mostrarPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'">
            <i class="bi" [class.bi-eye]="!mostrarPassword()" [class.bi-eye-slash]="mostrarPassword()" aria-hidden="true"></i>
          </button>
        </span>
      </label>

      @if (error()) {
        <div class="alert-message">{{ error() }}</div>
      }

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Validando...' : 'Ingresar' }}
      </button>
    </form>

    <footer>Credere.Dev</footer>
  </section>
</main>
