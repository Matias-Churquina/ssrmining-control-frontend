<section class="notification-stack" aria-live="polite" aria-label="Notificaciones">
  @for (notification of notifications.notifications(); track notification.id) {
    <article class="toast" [class]="notification.type">
      <span class="toast-icon">
        @switch (notification.type) {
          @case ('success') { <i class="bi bi-check2-circle"></i> }
          @case ('error') { <i class="bi bi-exclamation-octagon"></i> }
          @case ('warning') { <i class="bi bi-exclamation-triangle"></i> }
          @default { <i class="bi bi-info-circle"></i> }
        }
      </span>
      <p>{{ notification.message }}</p>
      <button type="button" (click)="notifications.dismiss(notification.id)" aria-label="Cerrar notificacion">
        <i class="bi bi-x"></i>
      </button>
    </article>
  }
</section>
